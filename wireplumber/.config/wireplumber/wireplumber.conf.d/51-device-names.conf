# Shorter names for audio outputs: the driver's ones (e.g. "TU106 High
# Definition Audio Controller Digital Stereo (HDMI)") make the bar's audio
# dropdown very wide, as it shows them in full.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*hdmi*" } ]
    actions = { update-props = { node.description = "HDMI", node.nick = "HDMI" } }
  }
]
