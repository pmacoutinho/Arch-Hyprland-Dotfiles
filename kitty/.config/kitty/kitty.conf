# vim:ft=kitty

## name:     Catppuccin Kitty Mocha
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/mocha.conf
## blurb:    Soothing pastel theme for the high-spirited!


# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Colours: the current theme's (theme-set / SUPER+CTRL+T).
include ~/.local/state/theme/current/kitty.conf

# theme-set switches colours live with `kitty @ set-colors` (no config reload,
# so programs running in kitty don't redraw). The socket is in the private
# runtime dir (mode 700): only your user can reach it.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

background_opacity .85


# fonts
font_family      GeistMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11
disable_ligatures never

# mouse
open_url_with firefox
copy_on_select yes

# cursor
cursor_shape beam
shell_integration no-cursor

# window settings
remember_window_size no
window_padding_width 15
confirm_os_window_close 0