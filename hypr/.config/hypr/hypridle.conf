general {
    lock_cmd = pidof hyprlock || /home/pedro/.local/bin/hyprlock-logged
    inhibit_sleep = 0
    # The lock is confirmed (hyprlock drawn on every screen): ~/.scripts/lock-suspend
    # waits for this to suspend at once.
    on_lock_cmd = touch "$XDG_RUNTIME_DIR/session-locked"
    # after-resume: unfreeze HyprPanel, bring Proton VPN back (see the script)
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'; ~/.scripts/after-resume
}
