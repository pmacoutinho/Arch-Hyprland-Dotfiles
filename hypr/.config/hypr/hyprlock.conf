# Colours from the current theme (theme-set); rose-pine.conf was the original.
source = $HOME/.local/state/theme/current/hyprlock.conf
# ($textHex/$accentHex: the theme's text and accent as plain hex, for the
# Pango markup in the input field's placeholder.)

$accent = $iris
$accentAlpha = $iris
$font = SF Pro Display

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = false  # the on-screen keyboard button needs the pointer
    ignore_empty_input = true
    fail_auth_delay = 0
}

# BACKGROUND
background {
    monitor =
    path = ~/.local/state/theme/lock-background
    blur_passes = 2
    blur_size = 4
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE 
label {
    monitor = 
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# # USER AVATAR
# image {
#     monitor = 
#     path = 
#     size = 100
#     border_color = $overlay

#     position = 0, 75
#     halign = center
#     valign = center
# }

label {
    monitor = 
    text = パスワード
    color = $text
    font_size = 50
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $overlay
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##$textHex" font_family="SF Pro Display"><span font_family="JetBrainsMono Nerd Font Propo"> </span>Logged in as <span foreground="##$accentHex">$USER</span></span>
    hide_input = false
    check_color = $overlay
    fail_color = $love
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $gold
    position = 0, -35
    halign = center
    valign = center
}

# ON-SCREEN KEYBOARD: a round button under the password field, in its style;
# click to open/close the keyboard (wvkbd, shown above the lock screen by
# hyprland.lua's "keyboard" layer rule); SUPER+O does the same. It closes by
# itself on unlock. Only the circle has the click (the icon is inside it):
# hyprlock runs every widget's onclick under the pointer, so both would
# open a keyboard each.
shape {
    monitor =
    size = 52, 52
    rounding = -1
    color = $surface
    border_size = 4
    border_color = $overlay
    onclick = sh ~/.scripts/onScreenKeyboard.sh
    position = 0, -111
    halign = center
    valign = center
    zindex = 0
}
label {
    monitor =
    # Propo: the icon at its real width (the wide variant gets clipped);
    # spaces around it so its edges aren't cut either.
    text =  󰌌 
    color = $text
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, -111
    halign = center
    valign = center
    zindex = 1
}
