unbind r
bind r source-file ~/.tmux.conf

# Change prefix
unbind C-b
set -g prefix C-b
bind C-b send-prefix

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Add vim keybinds
bind-key h select-pane -L
bind-key j select-pane -D 
bind-key k select-pane -U
bind-key l select-pane -R

# Put the status bar on top
set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catpuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_directory}"
#set -ag status-right "#[bg=#F5C2E7,fg=#313244] #[reverse]#[noreverse] "
#set -ag status-right "#[fg=#{@thm_fg},bg=#313244] #(awk '/MemTotal/ {total=$2} /MemAvailable/ {avail=$2} END {used=total-avail; printf \"%.1fG\", used/1024/1024}' /proc/meminfo) "
#set -ag status-right "#[bg=#F5C2E7,fg=#313244] #[reverse]#[noreverse]󰢮 "
#set -ag status-right "#[fg=#{@thm_fg},bg=#313244] #(gpustat --no-header --no-color | awk '{print $8$9}') "
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run '~/.tmux/plugins/tpm/tpm'
