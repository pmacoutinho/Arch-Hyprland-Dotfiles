name = "Gruvbox"
generate = true
hyprpanel = "gruvbox"
nvim_colorscheme = "gruvbox"
lualine = "auto"
fish = "generate"
bat = "gruvbox-dark"
gtk4 = "generate"
backgrounds = "~/.local/share/themes/gruvbox/backgrounds"
background = "dopesmoker_gruvbox.png"

# The VPN IT button (and its menu accent) use the weather module colour, which
# isn't on the bar: a blue that fits the theme (blue).
#
# Workspace icons: HyprPanel's gruvbox uses bright red (#fb4934, 96%
# saturation), too loud on the bar; the same red hue at 55% saturation.
# The workspace box gets that red as its outline too (HyprPanel has pure
# white), like the other boxes whose outline matches their contents; the
# tray box gets Gruvbox's cream text colour (fg, softer than white).
[hyprpanel_overrides]
"theme.bar.buttons.modules.weather.text" = "#83a598"
"theme.bar.buttons.workspaces.occupied" = "#d06b5f"
"theme.bar.buttons.workspaces.border" = "#d06b5f"
"theme.bar.buttons.systray.border" = "#ebdbb2"
