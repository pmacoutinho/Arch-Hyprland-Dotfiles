name = "Osaka Jade"
generate = true
# HyprPanel has no Osaka Jade theme: theme-generate makes hyprpanel.json from
# its Catppuccin Mocha theme, recoloured with this palette.
hyprpanel = "generate"
nvim_colorscheme = "bamboo"
lualine = "auto"
fish = "generate"
bat = "ansi"
gtk4 = "generate"
backgrounds = "~/.local/share/themes/osaka-jade/backgrounds"

# One colour for the whole bar (and folder icons): every Catppuccin accent
# colour HyprPanel uses becomes cream (#e3d7b8). Keys are Catppuccin
# colour names, values palette roles or "#rrggbb".
[hyprpanel_roles]
rosewater = "#e3d7b8"
flamingo = "#e3d7b8"
pink = "#e3d7b8"
mauve = "#e3d7b8"
red = "#e3d7b8"
maroon = "#e3d7b8"
peach = "#e3d7b8"
yellow = "#e3d7b8"
green = "#e3d7b8"
teal = "#e3d7b8"
sky = "#e3d7b8"
sapphire = "#e3d7b8"
blue = "#e3d7b8"
lavender = "#e3d7b8"
